<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>她她经营作战台</title>
<meta name="description" content="她她 HerDeserve 外卖经营监控台">
<meta name="theme-color" content="#111613">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="她她作战台">
<meta name="format-detection" content="telephone=no">
<style>
:root{--ink:#111613;--bg:#F2F4EE;--card:#FFFFFF;--line:#E3E8DD;--muted:#6E796C;--soft:#F6F8F2;
--yellow:#E6FB4D;--coral:#FF875F;--mint:#9DFB8D;--purple:#BDA6FF;--lime:#C4D23A;--mt:#FFC300;--tb:#FF6A2B;--green:#2E8B57;--red:#D9573A;
--r:18px;--sh:0 1px 2px rgba(17,22,19,.05),0 6px 20px rgba(17,22,19,.05)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;cursor:pointer}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#F4F6EF;padding:calc(10px + env(safe-area-inset-top)) 22px 0}
.top-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:22px;display:block}
.brand b{font-size:17px;letter-spacing:.5px;white-space:nowrap}.brand b i{font-style:normal;color:var(--yellow)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mint);border:1px solid rgba(157,251,141,.35);padding:3px 9px;border-radius:999px;white-space:nowrap}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(157,251,141,.7)}70%{box-shadow:0 0 0 8px rgba(157,251,141,0)}100%{box-shadow:0 0 0 0 rgba(157,251,141,0)}}
.clock{margin-left:auto;text-align:right;line-height:1.25}
.clock .t{font-size:20px;font-weight:700}.clock .t small{font-size:11px;color:var(--mint);font-weight:400;margin-left:4px}
.clock .s{font-size:11px;color:#A9B3AA}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:#AEB8AF;padding:11px 16px 12px;font-size:14px;font-weight:650;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--yellow)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#59645B;margin-left:6px;vertical-align:middle}
.tab .dot.ok{background:var(--mint)}
/* control bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:650;color:#4B564C}
.seg button.on{background:var(--ink);color:#fff}
.pill{font-size:11.5px;padding:5px 10px;border-radius:999px;background:#FFF4D6;color:#7A5B00;white-space:nowrap}
.pill.g{background:#E9F8E4;color:#2B6B35}
.upd{font-size:12px;color:var(--muted);margin-left:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:650}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.ticker{overflow:hidden;white-space:nowrap;background:#1C221F;color:#E8EDE3;font-size:12.5px;padding:7px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 48s linear infinite}
.ticker em{font-style:normal;color:var(--yellow);margin:0 10px 0 28px}
@keyframes tick{to{transform:translateX(-100%)}}
/* layout */
main{padding:16px 22px 28px;max-width:1680px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;min-width:0;border:1px solid #EDF0E8;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.go .card{opacity:1;transform:none}
.card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-size:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 9px}
.note{font-size:11.5px;color:var(--muted);line-height:1.6}
.miss{color:#B5543C;font-weight:650}
.nc{color:#8A938A;font-weight:650}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:14px}.kpis.kpis4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{position:relative;overflow:hidden;padding:14px 16px 10px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:650;display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:clamp(22px,2.1vw,30px);font-weight:800;letter-spacing:-.5px;margin:6px 0 4px}
.kpi .split{display:flex;gap:10px;font-size:11.5px;color:#4B564C;flex-wrap:wrap}
.kpi .n{font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:5px;min-height:28px}
.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--yellow))}
.badge{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;font-size:10.5px;font-weight:800;color:#111;margin-right:4px;vertical-align:-3px}
.b-mt{background:var(--mt)}.b-tb{background:var(--tb);color:#fff}
.spark{display:block;width:100%;height:30px;margin-top:4px}
.spark rect{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.go .spark rect{transform:scaleY(1)}
/* bars generic */
.hbar{height:10px;background:#EEF1EA;border-radius:999px;overflow:hidden}
.hbar i{display:block;height:100%;width:0;border-radius:999px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.go .hbar i{width:var(--w)}
/* trend */
.trend svg{width:100%;height:auto;display:block}
.trend .bars rect{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.go .trend .bars rect{transform:scaleY(1)}
.trend .line{stroke-dasharray:2000;stroke-dashoffset:2000;transition:stroke-dashoffset 1.6s ease .2s}
.go .trend .line{stroke-dashoffset:0}
.tip{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
/* rings */
.rings{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ring circle.f{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
/* table */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:650;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{text-align:right;padding:6px 6px;border-bottom:1px solid #F0F3EC}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.hl td{font-weight:800;background:#FAFDE6}
/* funnel */
.fun .st{margin:8px 0}
.fun .st .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.fun .st .hbar{height:26px;border-radius:10px}
.fun .st .hbar i{border-radius:10px}
/* flywheel */
.fly .path{stroke-dasharray:800;stroke-dashoffset:800;animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* placeholders */
.ph{border:1.5px dashed #CBD3C5;border-radius:14px;padding:14px;background:repeating-linear-gradient(45deg,#FAFBF8,#FAFBF8 10px,#F5F7F2 10px,#F5F7F2 20px)}
.ph .big{font-size:22px;font-weight:800;color:#8A938A}
.mtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.mt{background:var(--soft);border-radius:12px;padding:10px 12px}.mt .l{font-size:11.5px;color:var(--muted)}.mt .v{font-size:20px;font-weight:800;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:650;color:#4B564C}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dish{display:grid;grid-template-columns:26px minmax(0,1fr) 56px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #F0F3EC}
.dish .rk{font-weight:800;color:#9AA49A;font-size:12px}
.dish .nm{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dish .meta{font-size:11px;color:var(--muted);margin:2px 0 4px}
.dish .tot{text-align:right;font-size:18px;font-weight:800}
details.foot{margin-top:14px;background:#fff;border-radius:var(--r);border:1px solid #EDF0E8;padding:12px 16px}
details.foot summary{cursor:pointer;font-weight:650;font-size:13px}
details.foot p{font-size:11.5px;color:var(--muted);line-height:1.8;margin:8px 0 0}
.err{background:#FDECE7;color:#8A2E17;padding:10px 22px;font-size:13px;display:none}
.hint{font-size:12px;color:#4B564C;background:#FFFBE6;border:1px solid #F3E5A2;border-radius:12px;padding:8px 12px;margin:0 22px 0;display:none}
/* responsive */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.c3,.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
@media (max-width:760px){
 .top{padding:calc(8px + env(safe-area-inset-top)) 14px 0}.brand img{height:17px}.brand b{font-size:15px}
 .clock .t{font-size:16px}.clock .s{display:none}.live{display:none}
 .tab{padding:9px 12px 10px;font-size:13.5px}
 .bar{padding:10px 14px;gap:8px}.upd{margin-left:0;width:100%}
 main{padding:12px 12px 24px}.grid{gap:12px}
 .c3,.c4,.c5,.c6,.c7,.c8,.c12{grid-column:span 12}
 .kpis,.kpis.kpis4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .kpi .v{font-size:23px}.card{padding:14px}
 .mtiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<header class="top">
 <div class="top-row">
  <div class="brand"><img src="icons/logo-wordmark.png" alt="HerDeserve"><b>经营作战台<i>↗</i></b><span class="live">LIVE</span></div>
  <div class="clock"><div class="t num"><span id="clk">--:--:--</span><small>东京</small></div><div class="s num" id="clk2">济南 --:--</div></div>
 </div>
 <nav class="tabs" id="tabs"></nav>
</header>
<div class="bar">
 <div class="seg" id="seg-period"></div>
 <div class="seg" id="seg-plat"></div>
 <span class="pill" id="status">加载中…</span>
 <span class="upd" id="upd">更新时间：—</span>
 <button class="btn" id="refresh" title="重新拉取 data.json">刷新</button>
 <button class="btn dark" id="install" style="display:none">安装到桌面</button>
</div>
<div class="ticker" id="ticker"><span id="tick-inner"></span></div>
<div class="err" id="err"></div>
<div class="hint" id="hint"></div>
<main id="main"></main>
<script>
(function(){
'use strict';
var D=null, S={tab:'biz',period:'today',plat:'all',metric:'orders',hover:null,dcat:'全部'};
var TABS=[['biz','外卖经营',1],['ads','投流与营销',1],['social','社媒',0],['rep','口碑评分',1],['dish','菜品',1]];
var PERIODS=[['today','今日'],['week','本周'],['month','本月']], PLATS=[['all','合计'],['mt','美团'],['tb','淘宝闪购']];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function int(n){return Math.round(n).toLocaleString('zh-CN')}
function isNum(v){return typeof v==='number'&&isFinite(v)}
function cnt(v,fmt,miss){ if(!isNum(v)) return '<span class="miss">'+(miss||'未读到')+'</span>';
  return '<span class="num" data-count="'+v+'" data-fmt="'+(fmt||'int')+'">'+fmtv(0,fmt)+'</span>'}
function fmtv(v,f){return f==='money'?money(v):f==='pct'?v.toFixed(1)+'%':f==='dec1'?v.toFixed(1):int(v)}
var BM='<span class="badge b-mt">美</span>', BT='<span class="badge b-tb">淘</span>';
function P(){return D.periods[S.period]}
function sumP(k){var p=P();return (S.plat!=='tb'?p.mt[k]:0)+(S.plat!=='mt'?p.tb[k]:0)}
function expense(){var p=P();return S.plat==='all'?p.expense_all:S.plat==='mt'?p.mt.expense:p.tb.expense}
function bounty(){var p=P(); if(S.plat==='tb') return 0; return p.bounty}
function ads(){var a=P().ads; if(S.plat==='mt') return a.mt; if(S.plat==='tb') return a.tb; return (isNum(a.mt)&&isNum(a.tb))?a.mt+a.tb:null}
function after(){var a=P().after; if(!a) return null; return a[S.plat]}
function pick(o){return S.plat==='all'?o.all:S.plat==='mt'?o.mt:o.tb}
function daySeries(fn){return D.days.map(fn)}
function spark(vals,color,hiIdx){var w=300,h=30,n=vals.length,mx=Math.max.apply(null,vals.map(function(v){return v||0}).concat([1])),bw=w/n;
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+vals.map(function(v,i){var hh=v==null?2:Math.max(1,(v/mx)*(h-2));
  return '<rect x="'+(i*bw+1)+'" y="'+(h-hh)+'" width="'+(bw-3)+'" height="'+hh+'" rx="2" fill="'+(v==null?'#D9DED3':color)+'" opacity="'+(i===hiIdx?1:.55)+'" style="transition-delay:'+(i*25)+'ms"/>'}).join('')+'</svg>'}
function card(cls,icon,title,tag,body){return '<section class="card '+cls+'"><div class="ch"><h3><span class="ic">'+icon+'</span>'+title+'</h3>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>'+body+'</section>'}
function hbar(pct,color){pct=Math.max(0,Math.min(100,pct));return '<div class="hbar"><i style="--w:'+pct+'%;background:'+color+'"></i></div>'}
function ring(val,target,color,label,cap){var r=66,C=2*Math.PI*r,ratio=isNum(val)?Math.min(val/target,1):0;
 return '<div class="ring" style="text-align:center"><svg viewBox="0 0 210 190" width="100%"><circle cx="105" cy="88" r="66" fill="none" stroke="#EEF1EA" stroke-width="16"/>'+
 '<circle class="f" cx="105" cy="88" r="66" fill="none" stroke="'+color+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+C.toFixed(2)+'" data-off="'+(C*(1-ratio)).toFixed(2)+'" transform="rotate(-90 105 88)"/>'+
 '<text x="105" y="88" text-anchor="middle" font-size="30" font-weight="800" fill="#111613">'+(isNum(val)?(val/target*100).toFixed(1)+'%':'—')+'</text><text x="105" y="111" text-anchor="middle" font-size="12.5" fill="#6E796C">'+esc(label)+'</text>'+
 '<text x="105" y="182" text-anchor="middle" font-size="12" fill="#111613">'+esc(cap)+'</text></svg></div>'}

/* ---------- tab: 外卖经营 ---------- */
function vBiz(){
 var p=P(), n=D.days.length-1, mt=S.plat!=='tb', tb=S.plat!=='mt';
 var split=function(k,fmt){return '<div class="split">'+(mt?'<span>'+BM+fmtv(p.mt[k],fmt)+'</span>':'')+(tb?'<span>'+BT+fmtv(p.tb[k],fmt)+'</span>':'')+'</div>'};
 var en=pick(p.expense_note);
 var kp=[
  ['单量','#E6FB4D',cnt(sumP('orders')),split('orders'),D.chip_notes.orders,daySeries(function(d){return (mt?d.mo:0)+(tb?d.to:0)})],
  ['实付 / 营业额','#FF875F',cnt(sumP('gmv'),'money'),split('gmv','money'),tb?D.chip_notes.gmv_tb:D.chip_notes.gmv_mt,daySeries(function(d){return (mt?d.mg:0)+(tb?(d.tg||0):0)})],
  ['到手','#9DFB8D',cnt(sumP('income'),'money'),split('income','money'),D.chip_notes.income,daySeries(function(d){return (mt?d.mi:0)+(tb?d.ti:0)})],
  ['支出','#C4D23A',cnt(expense(),'money'),split('expense','money'),'商家优惠+佣金+商家配送补贴+配送费；'+en,daySeries(function(d){return d.exp?(S.plat==='all'?d.exp.all:S.plat==='mt'?d.exp.mt:d.exp.tb):null})],
  ['赏金（单列）','#BDA6FF',cnt(bounty(),'money','未汇总'),'<div class="split">'+(S.plat==='tb'?'淘宝无赏金':BM+'美团赏金联盟')+'</div>',S.period==='today'?'占美团到手 '+D.bounty.share_of_mt_income.toFixed(1)+'%，扣一次':S.period==='week'?p.after.note:'本月赏金未逐日汇总',null],
  ['扣赏金和投流后','#111613',cnt(after(),'money','未汇总'),'<div class="split">投流 '+(isNum(ads())?money(ads()):'<span class="miss">未汇总</span>')+'</div>',p.after?p.after.note:'本月赏金、投流未逐日汇总',null]
 ];
 var k='<div class="kpis">'+kp.map(function(x){return '<section class="card kpi" style="--acc:'+x[1]+'"><div class="k">'+x[0]+'<span class="tag">'+p.label+'</span></div><div class="v">'+x[2]+'</div>'+x[3]+'<div class="n">'+esc(x[4])+'</div>'+(x[5]?spark(x[5],x[1]==='#111613'?'#111613':x[1],n):'')+'</section>'}).join('')+'</div>';
 var g='<div class="grid">';
 g+=card('c8 trend','📈','趋势',S.plat==='all'?'美团 + 淘宝闪购':S.plat==='mt'?'美团':'淘宝闪购',
   '<div class="ch" style="margin-top:-4px"><span class="note">'+esc(D.trend_note)+'</span><div class="seg" id="seg-metric"><button data-m="orders" class="'+(S.metric==='orders'?'on':'')+'">单量</button><button data-m="income" class="'+(S.metric==='income'?'on':'')+'">到手</button></div></div>'+trendSVG()+'<div class="tip" id="tip"></div>');
 var pr=p.progress, pp=pr.done/pr.target*100;
 g+=card('c4','🎯','当标','全店目标 · '+platName()+'贡献','<div class="rings">'+ring(sumP('orders'),p.target_orders,'#C4D23A',p.label+'单量',int(sumP('orders'))+' / '+int(p.target_orders))+ring(sumP('gmv'),p.target_sales,'#FF875F',p.label+'销售额',money(sumP('gmv'))+' / ¥'+int(p.target_sales))+'</div>'+
   '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin:6px 0 6px"><span>'+(S.period==='today'?'当标率（保本线 41/天）':S.period==='week'?'本周应进度（41×天）':'本月应进度（41×天）')+'</span><b class="num">'+pr.done+' / '+pr.target+'（'+pp.toFixed(1)+'%）</b></div>'+hbar(pp,'#2E8B57')+
   '<div class="note" style="margin-top:8px">全店'+p.label+' '+int(p.mt.orders+p.tb.orders)+' 单 · '+money(p.mt.gmv+p.tb.gmv)+'</div>');
 g+=card('c4 fun','🔻','今日漏斗',platName(),funnel());
 g+=card('c4','⚖️','平台对比',p.label,platTable());
 g+=card('c4','💹','毛利与称呼','今日',marginBox());
 g+=card('c5 fly','♻️','飞轮','流量 × 转化',flywheel());
 g+=card('c7','📝','口径说明',p.label,'<p class="note" style="margin:0 0 8px">'+esc(p.note)+'</p><p class="note" style="margin:0 0 8px">'+esc(D.period_tail)+'</p><p class="note" style="margin:0">支出：'+esc(en)+'</p>');
 return k+g+'</div>';
}
function platName(){return S.plat==='all'?'合计':S.plat==='mt'?'美团':'淘宝闪购'}

 g+=card('c4','🏆','累计前三',esc(ds.cumulative.label),ds.cumulative.items.map(function(x,i){return '<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span><b style="color:#9AA49A;margin-right:6px">0'+(i+1)+'</b>'+esc(x.name)+'</span><b class="num" style="font-size:20px">'+cnt(x.n)+'<span style="font-size:11px;font-weight:400"> 份</span></b></div>'+hbar(x.n/ds.cumulative.items[0].n*100,['#E6FB4D','#FF875F','#9DFB8D'][i])+'</div>'}).join('')+'<p class="note">'+esc(ds.note)+'</p>');
 return g+'</div>'}

/* ---------- render ---------- */
function segs(){
 $('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(S.tab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'<span class="dot'+(t[2]?' ok':'')+'" title="'+(t[2]?'已接入':'未接入')+'"></span></button>'}).join('');
 $('seg-period').innerHTML=PERIODS.map(function(p){return '<button data-p="'+p[0]+'" class="'+(S.period===p[0]?'on':'')+'">'+p[1]+'</button>'}).join('');
 $('seg-plat').innerHTML=PLATS.map(function(p){return '<button data-pl="'+p[0]+'" class="'+(S.plat===p[0]?'on':'')+'">'+p[1]+'</button>'}).join('');
 var showSeg=S.tab==='biz'; $('seg-period').style.display=showSeg?'':'none'; $('seg-plat').style.display=showSeg?'':'none';
}
function animate(root){
 root.classList.remove('go'); void root.offsetWidth;
 requestAnimationFrame(function(){root.classList.add('go');
  root.querySelectorAll('circle.f').forEach(function(c){c.style.strokeDashoffset=c.getAttribute('data-off')});});
 var els=root.querySelectorAll('[data-count]'), t0=performance.now(), dur=1100;
 function step(now){var t=Math.min((now-t0)/dur,1), e=1-Math.pow(1-t,3);
  els.forEach(function(el){el.textContent=fmtv(parseFloat(el.getAttribute('data-count'))*e,el.getAttribute('data-fmt'))});
  if(t<1) requestAnimationFrame(step)}
 requestAnimationFrame(step);
}
function render(anim){
 if(!D) return; segs();
 var m=$('main'); m.innerHTML=(S.tab==='biz'?vBiz():S.tab==='ads'?vAds():S.tab==='social'?vSocial():S.tab==='rep'?vRep():vDish())+
  '<details class="foot"><summary>口径（完整说明）</summary><p>'+esc(D.footer)+'</p></details>';
 if($('tip')) $('tip').innerHTML=tipHTML();
 if(anim!==false) animate(m); else { m.classList.add('go'); m.querySelectorAll('[data-count]').forEach(function(el){el.textContent=fmtv(parseFloat(el.getAttribute('data-count')),el.getAttribute('data-fmt'))}); m.querySelectorAll('circle.f').forEach(function(c){c.style.strokeDashoffset=c.getAttribute('data-off')}); }
}
document.addEventListener('click',function(e){var b=e.target.closest('button,[data-i]'); if(!b) return;
 if(b.dataset.t){S.tab=b.dataset.t;render();window.scrollTo({top:0,behavior:'smooth'})}
 else if(b.dataset.p){S.period=b.dataset.p;render()}
 else if(b.dataset.pl){S.plat=b.dataset.pl;render()}
 else if(b.dataset.m){S.metric=b.dataset.m;render()}
 else if(b.dataset.c){S.dcat=b.dataset.c;render()}
 else if(b.dataset.i!=null){S.hover=+b.dataset.i;render(false)}
});
document.addEventListener('mouseover',function(e){var h=e.target.closest&&e.target.closest('.hit'); if(!h) return; var i=+h.dataset.i; if(S.hover===i) return; S.hover=i; var svg=h.closest('svg'); svg.outerHTML=trendSVG(); var tr=document.querySelector('.trend svg'); document.querySelector('.trend').classList.add('go'); $('tip').innerHTML=tipHTML();});
function clock(){var now=new Date(), f=function(tz,s){return new Intl.DateTimeFormat('zh-CN',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:s?'2-digit':undefined,hour12:false}).format(now)};
 $('clk').textContent=f('Asia/Tokyo',1); $('clk2').textContent='济南 '+f('Asia/Shanghai',0)}
function load(force){
 return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok) throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
  var changed=!D||D.updated_at!==j.updated_at; D=j; $('err').style.display='none';
  $('status').textContent=j.status; $('status').className='pill'+(/全天终版/.test(j.status)?' g':'');
  $('upd').textContent='更新时间：'+j.updated_label+' · 刷新于 '+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' 东京';
  $('tick-inner').innerHTML=(j.alerts||[]).map(function(a){return '<em>●</em>'+esc(a)}).join('')+'<em>●</em>'+esc(j.header_note);
  if(changed||force) render();
 }).catch(function(e){$('err').style.display='block';$('err').textContent='data.json 读取失败（'+e.message+'）'+(D?'，显示的是上次的数字。':'，请检查网络后点「刷新」。')});
}
$('refresh').onclick=function(){load(true)};
clock(); setInterval(clock,1000); load(); setInterval(function(){load(false)},5*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) load(false)});
/* PWA */
var deferred=null; window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('install').style.display=''});
$('install').onclick=function(){if(deferred){deferred.prompt();deferred=null;$('install').style.display='none'}};
var ua=navigator.userAgent, standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone){ if(/MicroMessenger/i.test(ua)){$('hint').style.display='block';$('hint').textContent='在微信里可以直接看。想放到桌面：点右上角「…」→「在浏览器打开」，再用浏览器的「添加到主屏幕」。'}
 else if(/iPhone|iPad|iPod/i.test(ua)){$('hint').style.display='block';$('hint').textContent='放到主屏幕：Safari 底部「分享」→「添加到主屏幕」。'} }
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(r){window.__swOK=true}).catch(function(e){window.__swErr=String(e)})})}
})();
</script>
