<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>她她经营作战台</title>
<meta name="description" content="她她 HerDeserve 经营作战台：外卖、营销、社媒、菜品、成本、财务">
<meta name="theme-color" content="#F4F5F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="她她作战台">
<meta name="format-detection" content="telephone=no">
<style>
:root{--ink:#141A16;--bg:#F4F5F0;--card:#fff;--line:#E8EBE3;--muted:#7A847B;--soft:#F6F7F3;--soft2:#EEF1E8;
--mt:#FFC300;--tb:#FF6A2B;--xhs:#FF2442;--dy:#161823;--dp:#FF6633;--r:22px;--sh:0 1px 2px rgba(20,26,22,.04),0 10px 30px rgba(20,26,22,.05)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 28px 10px}
.top-row{display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand img{height:19px;display:block}.brand b{font-size:15px;font-weight:750;white-space:nowrap}
.brand .live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#2E8B57;background:#E9F7EC;padding:3px 8px;border-radius:999px}
.brand .live:before{content:"";width:6px;height:6px;border-radius:50%;background:#35B26B;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,178,107,.6)}70%{box-shadow:0 0 0 7px rgba(53,178,107,0)}100%{box-shadow:0 0 0 0 rgba(53,178,107,0)}}
.tabs{display:flex;gap:2px;background:var(--soft2);padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 17px;border-radius:999px;font-size:13.5px;font-weight:650;color:#5C665D;white-space:nowrap;transition:background .2s}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.right{display:flex;align-items:center;gap:14px;flex:none}
.clock{text-align:right;line-height:1.2}.clock .t{font-size:17px;font-weight:750}.clock .t small{font-size:10.5px;color:var(--muted);font-weight:500;margin-left:3px}.clock .s{font-size:10.5px;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:650}
.icon-btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 28px 0;max-width:1640px;margin:0 auto}
.sub .ttl{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-right:6px}
.pill{font-size:11.5px;padding:5px 11px;border-radius:999px;background:#FFF4D6;color:#7A5B00;white-space:nowrap}
.pill.g{background:#E9F7EC;color:#23663A}.pill.r{background:#FDECE7;color:#9A3418}.pill.n{background:var(--soft2);color:#4F5A50}
.upd{font-size:12px;color:var(--muted);margin-left:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:650;color:#4F5A50}
.seg button.on{background:var(--ink);color:#fff}
.ticker{order:9;flex:1 1 100%;overflow:hidden;white-space:nowrap;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;padding:7px 0;color:#3F4A41}
@media(min-width:1200px){.ticker{order:0;flex:1 1 260px;min-width:200px}.upd{order:1;width:100%;margin-left:0;text-align:right;margin-top:-4px}}
.alerts2{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
@media(max-width:760px){.alerts2{grid-template-columns:1fr}}
.home .card{padding:18px 20px}.home .ch{margin-bottom:10px}
.ticker span{display:inline-block;padding-left:100%;animation:tick 55s linear infinite}
.ticker em{font-style:normal;color:#D9573A;margin:0 8px 0 26px}
@keyframes tick{to{transform:translateX(-100%)}}
main{padding:16px 28px 30px;max-width:1640px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;min-width:0;position:relative;opacity:0;transform:translateY(12px);transition:opacity .55s,transform .55s}
.go .card{opacity:1;transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ch h3{margin:0;font-size:14.5px;font-weight:750;display:flex;align-items:center;gap:9px}
.ch h3 .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--soft2);font-size:14px}
.tag{font-size:11px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.note{font-size:11.5px;color:var(--muted);line-height:1.65}
.miss{color:#B5543C;font-weight:650}.nc{color:#9AA39A;font-weight:650}
.lbl{font-size:12px;color:var(--muted);font-weight:600}
.hero-n{font-size:clamp(52px,5.2vw,78px);font-weight:850;letter-spacing:-2px;line-height:1}
.big{font-size:clamp(26px,2.3vw,34px);font-weight:820;letter-spacing:-.6px;line-height:1.1}
.mid{font-size:20px;font-weight:780;letter-spacing:-.3px}
.pi{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-size:13px;font-weight:850;color:#fff;flex:none}
.pi.sm{width:18px;height:18px;border-radius:6px;font-size:10.5px;vertical-align:-4px;margin-right:4px}
.pi.mt{background:var(--mt);color:#111}.pi.tb{background:var(--tb)}.pi.xhs{background:var(--xhs)}.pi.dy{background:var(--dy)}.pi.dp{background:var(--dp)}.pi.wx{background:#07C160}
.split{display:flex;gap:12px;font-size:12px;color:#4F5A50;flex-wrap:wrap;align-items:center}
.hbar{height:8px;background:var(--soft2);border-radius:999px;overflow:hidden}
.hbar i{display:block;height:100%;width:0;border-radius:999px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.go .hbar i{width:var(--w)}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft2)}
.stack i{display:block;height:100%}
svg .grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.go svg .grow{transform:scaleY(1)}
svg .draw{stroke-dasharray:2400;stroke-dashoffset:2400;transition:stroke-dashoffset 1.6s ease .2s}
.go svg .draw{stroke-dashoffset:0}
.ring circle.f{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.tiles{display:grid;gap:10px}.t2{grid-template-columns:repeat(2,minmax(0,1fr))}.t3{grid-template-columns:repeat(3,minmax(0,1fr))}.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--soft);border-radius:16px;padding:12px 14px;min-width:0}
.tile .l{font-size:11.5px;color:var(--muted)}.tile .v{font-size:19px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px 12px}
.kpi .k{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:650}
.kpi .v{font-size:clamp(23px,2vw,30px);font-weight:820;letter-spacing:-.5px;margin:8px 0 6px}
.kpi .n{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:6px}
.kpi .dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.spark{display:block;width:100%;height:30px;margin-top:6px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:650;color:var(--muted);text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
table.t td{text-align:right;padding:8px 6px;border-bottom:1px solid #F1F3EE}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.hl td{font-weight:800;background:#FAFDEB}
.tw{overflow-x:auto}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F1F3EE}
.row:last-child{border-bottom:0}.row .grow1{flex:1;min-width:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.55}
.alert:last-child{border-bottom:0}
.alert b.d{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:#D9573A}
.ph{border:1.5px dashed #D3DACC;border-radius:16px;padding:12px 14px;background:repeating-linear-gradient(45deg,#FBFCF9,#FBFCF9 10px,#F6F8F3 10px,#F6F8F3 20px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:650;color:#4F5A50}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dish{display:grid;grid-template-columns:26px minmax(0,1fr) 56px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #F1F3EE}
.dish .rk{font-weight:800;color:#A3ACA3;font-size:12px}.dish .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dish .meta{font-size:11px;color:var(--muted);margin:3px 0 5px}.dish .tot{text-align:right;font-size:19px;font-weight:820}
.sec{font-size:13px;font-weight:750;color:#4F5A50;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
details.foot{margin-top:16px;background:#fff;border-radius:var(--r);padding:14px 20px;box-shadow:var(--sh)}
details.foot summary{cursor:pointer;font-weight:650;font-size:13px}
details.foot p{font-size:11.5px;color:var(--muted);line-height:1.8;margin:8px 0 0}
.err{background:#FDECE7;color:#8A2E17;padding:10px 28px;font-size:13px;display:none}
.hint{font-size:12px;color:#4F5A50;background:#FFFBE6;border:1px solid #F3E5A2;border-radius:12px;padding:8px 12px;margin:12px 28px 0;display:none}
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tab{padding:8px 12px}}
@media (max-width:1100px){.c3,.c4,.c5{grid-column:span 6}.c6,.c7,.c8{grid-column:span 12}.top-row{flex-wrap:wrap}.tabs{order:3;width:100%;margin:0}}
@media (max-width:760px){
 .top{padding:calc(8px + env(safe-area-inset-top)) 14px 8px}.brand img{height:15px}.brand b{font-size:13.5px}.brand .live{display:none}
 .clock .t{font-size:15px}.clock .s{display:none}.right{gap:8px;margin-left:auto}#refresh{display:none}
 .tabs{border-radius:14px}.tab{padding:7px 12px;font-size:13px}
 .sub{padding:12px 14px 0;gap:8px}.sub .ttl{font-size:19px}.upd{margin-left:0;width:100%}
 .hint{margin:10px 14px 0}
 main{padding:12px 14px 26px}.grid{gap:12px}
 .c3,.c4,.c5,.c6,.c7,.c8,.c12{grid-column:span 12}
 .kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .card{padding:16px}.hero-n{font-size:58px}.t4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .herosplit{flex-direction:column;align-items:stretch!important}.herosplit .tiles{min-width:0!important}
}
.fbt td,.fbt th{text-align:left!important;vertical-align:top}.fbt td:nth-child(5){line-height:1.55;min-width:260px}.fbt td:nth-child(4){font-size:12px;max-width:200px}.fbt td:nth-child(1),.fbt td:nth-child(2),.fbt td:nth-child(3){white-space:nowrap}
</style>
</head>
<body>
<header class="top">
 <div class="top-row">
  <div class="brand"><img src="icons/logo-wordmark-dark.png" alt="HerDeserve"><b>经营作战台</b><span class="live">LIVE</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="right">
   <div class="clock"><div class="t num"><span id="clk">--:--:--</span><small>东京</small></div><div class="s num" id="clk2">济南 --:--</div></div>
   <button class="icon-btn" id="refresh" title="重新拉取 data.json">刷新</button>
   <button class="icon-btn dark" id="install" style="display:none">安装</button>
  </div>
 </div>
</header>
<div class="err" id="err"></div>
<div class="hint" id="hint"></div>
<div class="sub"><div id="sub" style="display:contents"></div><div class="ticker"><span id="tick-inner"></span></div></div>
<main id="main"></main>
<script>
(function(){
'use strict';
var D=null,S={tab:'home',period:'today',plat:'all',metric:'orders',hover:null,dcat:'全部'};
var TABS=[['home','总览'],['biz','经营'],['mkt','营销'],['social','社媒·口碑'],['dish','菜品'],['cost','成本'],['fin','财务']];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function isNum(v){return typeof v==='number'&&isFinite(v)}
function money(n,dp){dp=dp==null?2:dp;var s=Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:dp,maximumFractionDigits:dp});return (n<0?'−':'')+'¥'+s}
function int(n){return Math.round(n).toLocaleString('zh-CN')}
function fmtv(v,f){return f==='money'?money(v):f==='money0'?money(v,0):f==='pct'?v.toFixed(1)+'%':f==='dec1'?v.toFixed(1):int(v)}
function cnt(v,fmt,miss){if(!isNum(v))return '<span class="miss">'+(miss||'未读到')+'</span>';return '<span class="num" data-count="'+v+'" data-fmt="'+(fmt||'int')+'">'+fmtv(0,fmt)+'</span>'}
function show(v,fmt,miss){return isNum(v)?fmtv(v,fmt):'<span class="miss">'+(miss||'未读到')+'</span>'}
function PI(k,sm){k={xiaohongshu:'xhs',douyin:'dy',dianping:'dp',miniapp:'wx'}[k]||k;var t={mt:'美',tb:'淘',xhs:'书',dy:'抖',dp:'点',wx:'微'}[k];return '<span class="pi '+k+(sm?' sm':'')+'">'+t+'</span>'}
function card(cls,icon,title,tag,body,style){return '<section class="card '+cls+'"'+(style?' style="'+style+'"':'')+'><div class="ch"><h3>'+(icon?'<span class="ic">'+icon+'</span>':'')+title+'</h3>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>'+body+'</section>'}
function hbar(pct,color,h){pct=Math.max(0,Math.min(100,pct||0));return '<div class="hbar"'+(h?' style="height:'+h+'px"':'')+'><i style="--w:'+pct+'%;background:'+color+'"></i></div>'}
function ring(val,target,color,size,label,cap){var r=62,C=2*Math.PI*r,ratio=isNum(val)?Math.min(val/target,1):0;
 return '<svg class="ring" viewBox="0 0 160 '+(cap?186:160)+'" width="'+(size||160)+'"><circle cx="80" cy="80" r="62" fill="none" stroke="#EEF1E8" stroke-width="14"/>'+
 '<circle class="f" cx="80" cy="80" r="62" fill="none" stroke="'+color+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+C.toFixed(2)+'" data-off="'+(C*(1-ratio)).toFixed(2)+'" transform="rotate(-90 80 80)"/>'+
 '<text x="80" y="82" text-anchor="middle" font-size="27" font-weight="850" fill="#141A16">'+(isNum(val)?(val/target*100).toFixed(1)+'%':'—')+'</text><text x="80" y="104" text-anchor="middle" font-size="11.5" fill="#7A847B">'+esc(label||'')+'</text>'+
 (cap?'<text x="80" y="180" text-anchor="middle" font-size="12" fill="#141A16">'+esc(cap)+'</text>':'')+'</svg>'}
function spark(vals,color,hi){var w=300,h=30,n=vals.length,mx=Math.max.apply(null,vals.map(function(v){return v||0}).concat([1])),bw=w/n;
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+vals.map(function(v,i){var hh=v==null?2:Math.max(1.5,(v/mx)*(h-2));
 return '<rect class="grow" x="'+(i*bw+1)+'" y="'+(h-hh)+'" width="'+(bw-3)+'" height="'+hh+'" rx="2" fill="'+(v==null?'#DCE1D6':color)+'" opacity="'+(i===hi?1:.5)+'" style="transition-delay:'+(i*25)+'ms"/>'}).join('')+'</svg>'}
function P(){return D.periods[S.period]}
function sumP(k){var p=P(),a=S.plat!=='tb'?p.mt[k]:0,b=S.plat!=='mt'?p.tb[k]:0;return isNum(a)&&isNum(b)?a+b:null}
function platName(){return S.plat==='all'?'合计':S.plat==='mt'?'美团':'淘宝闪购'}
function pick(o){return S.plat==='all'?o.all:S.plat==='mt'?o.mt:o.tb}
function L(){return D.ledger||null}
function lcat(M,name){var c=(M.categories||[]).filter(function(x){return x.name===name})[0];return c?c.amount:null}
function md(s){return s?s.slice(5):''}

/* ================= 总览 ================= */
function vHome(){
 var t=D.periods.today,w=D.periods.week,m=D.periods.month,ord=t.mt.orders+t.tb.orders,g='<div class="grid home">',days=D.days,N=days.length;
 var bars=days.map(function(d){return d.mo+d.to}),mx=Math.max.apply(null,bars.concat([45])),H=46,W=560,bw=W/N,y41=H-41/mx*H;
 var mini='<svg viewBox="0 0 '+W+' '+(H+14)+'" width="100%" style="display:block;margin-top:12px">'+
  '<line x1="0" x2="'+W+'" y1="'+y41+'" y2="'+y41+'" stroke="#2E8B57" stroke-dasharray="4 5"/>'+
  bars.map(function(v,i){var h=Math.max(2,v/mx*H);return '<rect class="grow" x="'+(i*bw+4)+'" y="'+(H-h)+'" width="'+(bw-8)+'" height="'+h+'" rx="3" fill="'+(i===N-1?'#141A16':v>=41?'#8EE6A0':'#D4F04C')+'" style="transition-delay:'+(i*30)+'ms"/><text x="'+(i*bw+bw/2)+'" y="'+(H+12)+'" text-anchor="middle" font-size="9.5" fill="#9AA39A">'+days[i].date.slice(3)+'</text>'}).join('')+
  '<text x="'+W+'" y="'+(y41-4)+'" text-anchor="end" font-size="10" fill="#2E8B57">保本线 41</text></svg>';
 g+=card('c6','🛵','今日外卖','美团 + 淘宝闪购',
  '<div class="herosplit" style="display:flex;gap:18px;align-items:center;justify-content:space-between"><div style="min-width:0;flex:1">'+
  '<div class="lbl">有效单量</div><div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><span class="hero-n">'+cnt(ord)+'</span><span style="font-size:15px;color:var(--muted)">单</span>'+
  '<span class="split" style="margin-left:10px"><span>'+PI('mt',1)+t.mt.orders+'</span><span>'+PI('tb',1)+t.tb.orders+'</span></span></div>'+
  '<div class="tiles t3" style="margin-top:14px;min-width:340px"><div class="tile"><div class="l">实付 / 营业额</div><div class="v num">'+cnt(isNum(t.mt.gmv)&&isNum(t.tb.gmv)?t.mt.gmv+t.tb.gmv:null,'money')+'</div></div><div class="tile"><div class="l">到手</div><div class="v num">'+cnt(t.mt.income+t.tb.income,'money')+'</div></div><div class="tile"><div class="l">扣赏金投流后</div><div class="v num">'+cnt(t.after?t.after.all:null,'money','未汇总')+'</div></div></div>'+

  (l.checks.length?'<p class="note">'+l.checks.map(esc).join('；')+'</p>':'')+'<p class="note" style="margin:10px 0 0">'+esc(l.note)+' 来源：珊珊记账本（文件时间 '+esc(l.file_mtime)+'）。新版记账本发来后运行 python3 ledger_import.py 新文件.xlsx 即可重算本页。</p>');
 return k+g+'</div>'}

/* ================= render ================= */
function sub(){var t=TABS.filter(function(x){return x[0]===S.tab})[0][1],h='<span class="ttl">'+(S.tab==='home'?'经营总览':t)+'</span>';
 if(S.tab==='biz'){h+='<div class="seg">'+[['today','今日'],['week','本周'],['month','本月']].map(function(p){return '<button data-p="'+p[0]+'" class="'+(S.period===p[0]?'on':'')+'">'+p[1]+'</button>'}).join('')+'</div><div class="seg">'+[['all','合计'],['mt','美团'],['tb','淘宝闪购']].map(function(p){return '<button data-pl="'+p[0]+'" class="'+(S.plat===p[0]?'on':'')+'">'+p[1]+'</button>'}).join('')+'</div>'}
 h+=(S.tab==='fin'||S.tab==='cost')?(D.ledger?'<span class="pill n">账本截至 '+D.ledger.as_of+'</span>':''):'<span class="pill'+(/全天终版/.test(D.status)?' g':'')+'">'+esc(D.status)+'</span>';
 h+='<span class="upd">更新时间：'+esc(D.updated_label)+' · 刷新于 '+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' 东京</span>';
 $('sub').innerHTML=h;
 $('tabs').innerHTML=TABS.map(function(x){return '<button class="tab'+(S.tab===x[0]?' on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>'}).join('');
}
function animate(root){root.classList.remove('go');void root.offsetWidth;
 requestAnimationFrame(function(){root.classList.add('go');root.querySelectorAll('circle.f').forEach(function(c){c.style.strokeDashoffset=c.getAttribute('data-off')})});
 var els=root.querySelectorAll('[data-count]'),t0=performance.now(),dur=1100;
 function step(now){var t=Math.min((now-t0)/dur,1),e=1-Math.pow(1-t,3);els.forEach(function(el){el.textContent=fmtv(parseFloat(el.getAttribute('data-count'))*e,el.getAttribute('data-fmt'))});if(t<1)requestAnimationFrame(step)}
 requestAnimationFrame(step)}
function render(anim){if(!D)return;sub();
 var m=$('main'),V={home:vHome,biz:vBiz,mkt:vMkt,social:vSocial,dish:vDish,cost:vCost,fin:vFin}[S.tab];
 m.innerHTML=V()+(S.tab==='dish'?'':'<details class="foot"><summary>口径（完整说明）</summary><p>'+esc(D.footer)+'</p></details>');
 if($('tip'))$('tip').innerHTML=tipHTML();
 if(anim!==false)animate(m);else{m.classList.add('go');m.querySelectorAll('[data-count]').forEach(function(el){el.textContent=fmtv(parseFloat(el.getAttribute('data-count')),el.getAttribute('data-fmt'))});m.querySelectorAll('circle.f').forEach(function(c){c.style.strokeDashoffset=c.getAttribute('data-off')})}
}
document.addEventListener('click',function(e){var b=e.target.closest('button,[data-i]');if(!b)return;
 if(b.dataset.t){S.tab=b.dataset.t;S.hover=null;render();try{history.replaceState(null,'','#'+S.tab)}catch(_){}window.scrollTo(0,0)}
 else if(b.dataset.p){S.period=b.dataset.p;render()}else if(b.dataset.pl){S.plat=b.dataset.pl;render()}
 else if(b.dataset.m){S.metric=b.dataset.m;render()}else if(b.dataset.c){S.dcat=b.dataset.c;render()}
 else if(b.dataset.i!=null){S.hover=+b.dataset.i;render(false)}});
document.addEventListener('mouseover',function(e){var h=e.target.closest&&e.target.closest('.hit');if(!h)return;var i=+h.dataset.i;if(S.hover===i)return;S.hover=i;var box=document.querySelector('.trend');if(box)box.innerHTML=trendSVG();if($('tip'))$('tip').innerHTML=tipHTML()});
function clock(){var now=new Date(),f=function(tz,s){return new Intl.DateTimeFormat('zh-CN',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:s?'2-digit':undefined,hour12:false}).format(now)};$('clk').textContent=f('Asia/Tokyo',1);$('clk2').textContent='济南 '+f('Asia/Shanghai',0)}
function load(force){return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
  var changed=!D||D.updated_at!==j.updated_at||(D.ledger&&D.ledger.as_of)!==(j.ledger&&j.ledger.as_of);D=j;$('err').style.display='none';
  var al=(j.alerts||[]).slice();if(j.ledger)al.push('欠供应商 '+money(j.ledger.payables.total)+'，待报销 '+money(j.ledger.reimburse.total)+'（账本截至 '+j.ledger.as_of.slice(5)+'）');
  $('tick-inner').innerHTML=al.map(function(a){return '<em>●</em>'+esc(a)}).join('')+'<em style="color:#2E8B57">●</em>'+esc(j.header_note);
  if(changed||force)render()}).catch(function(e){$('err').style.display='block';$('err').textContent='data.json 读取失败（'+e.message+'）'+(D?'，显示的是上次的数字。':'，请检查网络后点「刷新」。')})}
var h0=(location.hash||'').slice(1);if(TABS.some(function(x){return x[0]===h0}))S.tab=h0;
$('refresh').onclick=function(){load(true)};
clock();setInterval(clock,1000);load();setInterval(function(){load(false)},5*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load(false)});
var deferred=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('install').style.display=''});
$('install').onclick=function(){if(deferred){deferred.prompt();deferred=null;$('install').style.display='none'}};
var ua=navigator.userAgent,standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone){if(/MicroMessenger/i.test(ua)){$('hint').style.display='block';$('hint').textContent='在微信里可以直接看。想放到桌面：点右上角「…」→「在浏览器打开」，再用浏览器的「添加到主屏幕」。'}
 else if(/iPhone|iPad|iPod/i.test(ua)){$('hint').style.display='block';$('hint').textContent='放到主屏幕：Safari 底部「分享」→「添加到主屏幕」。'}}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').then(function(){window.__swOK=true}).catch(function(e){window.__swErr=String(e)})})}
})();
</script>
